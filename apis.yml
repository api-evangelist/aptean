aid: aptean
name: Aptean
description: >-
  Aptean is a global provider of industry-specific, AI-powered enterprise
  software — ERP, CRM, supply chain and compliance solutions — for manufacturing,
  distribution, food & beverage, transportation and other complex industries.
  Headquartered in Alpharetta, Georgia and backed by Insight Partners, Aptean
  serves roughly 5,000 customers worldwide. Its developer-facing surface is the
  Aptean Integration Platform (AIP), an event/webhook integration API where
  products publish events against event definitions and consumer tenants
  subscribe to receive them, secured with Bearer JWT and APIM subscription
  headers.
