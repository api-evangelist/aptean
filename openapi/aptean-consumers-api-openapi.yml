        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: deleteV1ConsumersById
      x-operation-id-source: derived
components:
  schemas:
    Aptean.ATG.IntegrationPlatform.Api.Resources.Consumer:
      required:
      - subscribedEvents
      type: object
      properties:
        id:
          type: string
          description: Gets or sets the unique identifier.
          format: uuid
        createdBy:
          type:
          - string
          - 'null'
          description: Gets the created by property.
        createdTimestamp:
          type: string
          description: Gets or sets timestamp that indicates when this document got created.
          format: date-time
        modifiedBy:
          type:
          - string
          - 'null'
          description: Gets the modified by property.
        modifiedTimestamp:
          type:
          - string
          - 'null'
          description: Gets or sets timestamp that indicates when this document got last modified.
          format: date-time
        producerId:
          type:
          - string
          - 'null'
          description: Gets or sets producer ID.
          format: uuid
        productId:
          type:
          - string
          - 'null'
          description: ProductId where the consumer gets notifications from.
          format: uuid
        producerProductId:
          type:
          - string
          - 'null'
          description: In case of multi-tenant consumer, this is the product where the consumer gets notifications from.
          format: uuid
        tenantId:
          type: string
          description: TenantId owning this consumer.
          format: uuid
        sourceTenant:
          type:
          - string
          - 'null'
          description: Source tenant of this consumer.
        subscribedEvents:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Aptean.ATG.IntegrationPlatform.Api.Resources.SubscribedEvent'
          description: Gets or sets list of subscribed events.
        contactEmail:
          type:
          - string
          - 'null'
          description: Gets or sets the contact email.
      additionalProperties: false
      description: Resource that represents a consumer.
    ? Aptean.ATG.IntegrationPlatform.Api.Resources.Responses.AipSuccessResponse_1_Aptean.ATG.IntegrationPlatform.Api.Resources.Consumer
    : type: object
      properties:
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
          description: Gets or sets the collection of warnings for executed action.
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Aptean.ATG.IntegrationPlatform.Api.Resources.Consumer'
          description: The collection of items.
      additionalProperties: false
      description: 'Success typed AIP response.

        <typeparam name="TItem">Type of the item.</typeparam>'
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Aptean.ATG.IntegrationPlatform.Api.Resources.SubscribedEvent:
      required:
      - attempts
      - eventDefinitionType
      - ttl
      - webhook
      type: object
      properties:
        eventDefinitionType:
          minLength: 1
          type: string
          description: Gets or sets event definition type.
        webhook:
          pattern: ^https:\/\/[\w.-]+(?:\.[\w\.-]+)+[\w\-\._~:/?#[\]@!\$&'\(\)\*\+,;=.]+$
          type: string($uri)
          description: Gets or sets webhook URL.
          example: https://localhost
        ttl:
          type: string
          description: 'Gets or sets time-to-live value.

            (min value: 0.00:01:00, max value: 1.00:00:00).

            The value will be rounded to the nearest minute.'
          format: duration
          example: 0.00:00:00
        attempts:
          maximum: 30
          minimum: 1
          type: integer
          description: Gets or sets attempts count.
          format: int32
        status:
          $ref: '#/components/schemas/Aptean.ATG.IntegrationPlatform.Api.Resources.Base.ProvisioningStatus'
        statusReason:
          type:
          - string
          - 'null'
          description: Status reason of provisioning.
      additionalProperties: false
      description: Resource that represents subscribed event.
    Aptean.ATG.IntegrationPlatform.Api.Resources.GenericResponses.DeleteResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/Aptean.ATG.IntegrationPlatform.Api.Resources.GenericResponses.ResponseResult'
        info:
          type:
          - string
          - 'null'
          description: Provides info about the delete action.
      additionalProperties: false
      description: Resource to describe the delete action.
    Aptean.ATG.IntegrationPlatform.Api.Resources.Responses.AipWarningResponse:
      type: object
      properties:
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
          description: Gets or sets the collection of warnings for executed action.
      additionalProperties: false
      description: Warning AIP response.
    Aptean.ATG.IntegrationPlatform.Api.Resources.GenericResponses.ResponseResult:
      enum:
      - success
      - error
      type: string
      description: Describes the global result.
    Aptean.ATG.IntegrationPlatform.Api.Resources.Base.ProvisioningStatus:
      enum:
      - pending
      - active
      - failed
      - pendingRemoval
      - removalFailed
      - removed
      type: string
      description: Indicates the status of provisioning.
    ? Aptean.ATG.IntegrationPlatform.Api.Resources.Responses.AipSuccessResponse_1_Aptean.ATG.IntegrationPlatform.Api.Resources.GenericResponses.DeleteResponse
    : type: object
      properties:
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
          description: Gets or sets the collection of warnings for executed action.
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Aptean.ATG.IntegrationPlatform.Api.Resources.GenericResponses.DeleteResponse'
          description: The collection of items.
      additionalProperties: false
      description: 'Success typed AIP response.

        <typeparam name="TItem">Type of the item.</typeparam>'
    Aptean.ATG.IntegrationPlatform.Api.Resources.Requests.NewConsumerRequest:
      required:
      - contactEmail
      - subscribedEvents
      type: object
      properties:
        producerId:
          type:
          - string
          - 'null'
          description: Gets or sets the producer id.
          format: uuid
        productIdProducer:
          type:
          - string
          - 'null'
          description: Gets or sets the producer's product id.
          format: uuid
        sourceTenant:
          type:
          - string
          - 'null'
          description: Gets or sets the source tenant.
        subscribedEvents:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/Aptean.ATG.IntegrationPlatform.Api.Resources.SubscribedEvent'
          description: Gets or sets the subscribed events list.
        contactEmail:
          minLength: 5
          pattern: ^[a-zA-Z0-9_\.-]+@([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,6}$
          type: string
          description: Gets or sets the contact email.
      additionalProperties: false
      description: New consumer request.
    Aptean.ATG.IntegrationPlatform.Api.Resources.Responses.AipErrorResponse:
      type: object
      properties:
        warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
          description: Gets or sets the collection of warnings for executed action.
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
          description: Gets or sets the collection of errors for executed action.
      additionalProperties: false
      description: Error AIP response.
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
      scheme: bearer
